<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C8C99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded rect (macOS icon shape) -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Document page -->
  <g filter="url(#shadow)">
    <path d="M 280 160 L 620 160 L 744 284 L 744 864 L 280 864 Z" fill="url(#docGrad)" stroke="#D0D0D0" stroke-width="2"/>
    <!-- Page fold -->
    <path d="M 620 160 L 620 284 L 744 284 Z" fill="#E0E0E0" stroke="#D0D0D0" stroke-width="1"/>
  </g>

  <!-- Markdown symbol: M with down arrow -->
  <!-- Letter M -->
  <text x="410" y="560" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="240" font-weight="bold" fill="#2C8C99" text-anchor="middle">M</text>

  <!-- Down arrow (markdown indicator) -->
  <path d="M 540 580 L 540 700 L 500 660 M 540 700 L 580 660" 
        stroke="#2C8C99" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Decorative lines representing text -->
  <rect x="340" y="740" width="200" height="12" rx="6" fill="#2C8C99" opacity="0.3"/>
  <rect x="340" y="772" width="320" height="12" rx="6" fill="#2C8C99" opacity="0.2"/>
  <rect x="340" y="804" width="260" height="12" rx="6" fill="#2C8C99" opacity="0.15"/>
</svg>
# SwiftLint Configuration - Enterprise Swift Markdown Reader
# Zero-warning policy for enterprise development

# Included/Excluded paths
included:
  - Apps
  - Packages
  - Sources

excluded:
  - .build
  - DerivedData
  - Carthage
  - vendor
  - "**/*.generated.swift"

# Analyzer rules (require compilation)
analyzer_rules:
  - explicit_self
  - unused_import
  - unused_declaration

# Enabled rules
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - nslocalizedstring_key
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo  # TODOs are acceptable during development
  - force_cast  # rare, guarded downcasts; not worth failing the gate
  # The following opt-in rules were removed above rather than listed here:
  #   attributes, collection_alignment, vertical_parameter_alignment_on_call,
  #   multiline_function_chains -> owned by SwiftFormat (avoid tool overlap/conflict)
  #   force_unwrapping -> idiomatic in the test suite; production force-unwraps in the
  #     viewer flagged by review were removed by the swift-markdown rewrite
  #   function_default_parameter_at_end / raw_value_for_camel_cased_codable_enum ->
  #     would require risky API/signature churn for no functional gain
  #   modifier_order / number_separator -> owned by SwiftFormat (modifierOrder /
  #     numberFormatting); keeping them in both tools causes format oscillation
  # file_header: the codebase uses varied `///` doc headers and some files begin
  # directly with imports; enforcing a single banner adds churn without value.
  # multiline_arguments: the codebase consistently formats call arguments in a
  # style this opinionated rule rejects; reformatting every call site is high
  # churn/risk for no functional gain.

# Rule configurations
conditional_returns_on_newline:
  if_only: true

cyclomatic_complexity:
  warning: 25
  error: 40

enum_case_associated_values_count:
  warning: 5
  error: 6

file_length:
  warning: 800
  error: 1200
  ignore_comment_only_lines: true

file_name:
  excluded:
    - main.swift
    - LinuxMain.swift
    - MarkdownRenderingTypes.swift
    - PlatformCompatibility.swift
    - SearchPreviewSupport.swift

function_body_length:
  warning: 200
  error: 300

function_parameter_count:
  warning: 8
  error: 10

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - db
    - x
    - y
    - z
    - i
    - j
    - k

large_tuple:
  warning: 3
  error: 4

line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

multiline_parameters:
  allows_single_line: true

nesting:
  type_level:
    warning: 2
    error: 3

private_over_fileprivate:
  validate_extensions: true

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

type_body_length:
  warning: 800
  error: 1000

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - ID

vertical_whitespace:
  max_empty_lines: 1

# Note: the zero-tolerance policy is enforced by running `swiftlint --strict`
# (used in CI), which promotes every violation to a build-failing error. A
# separate `warning_threshold` is redundant under --strict and misreports, so
# it is intentionally omitted.